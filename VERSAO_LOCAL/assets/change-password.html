<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha · RADACHE</title><link rel="stylesheet" href="/assets/fonts/inter.css"><link rel="stylesheet" href="/assets/change-password.css"><script src="/assets/change-password.js" defer></script></head>
<body><main class="password-card"><section><a class="brand" href="/">RADACHE <span>ACESSO LOCAL</span></a><h1>Defina sua senha de acesso</h1><p>Altere a senha inicial para continuar. As sessões anteriores serão encerradas.</p>
<form id="password-form"><p><label>Senha atual <input id="current" type="password" autocomplete="current-password" required></label></p><p><label>Nova senha <input id="next" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label></p><p><label>Confirme a nova senha <input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label></p><button type="submit">Salvar nova senha</button><p id="message" role="status" aria-live="polite"></p></form><a href="/gestao/">Voltar ao acesso</a></section></main></body></html>
